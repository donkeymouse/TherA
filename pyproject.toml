[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thera"
version = "0.1.0"
description = "TherA: Thermal-Aware Visual-Language Prompting for Controllable RGB-to-Thermal Infrared Translation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["thera_paths", "thera_llava"]

[tool.setuptools.packages.find]
include = ["llava*", "lavi_ip2p*", "lavi_bridge*"]

[tool.setuptools.package-data]
llava = ["data/*.txt"]
